name = "agentora"
main = "src/index.js"
compatibility_date = "2026-11-01"

# Lets src/index.js import skill.md and schema.sql as text
[[rules]]
type = "Text"
globs = ["**/*.md", "**/*.sql"]
fallthrough = true

# Create the database in the Cloudflare dashboard (Storage & Databases → D1)
# and paste its id here.
[[d1_databases]]
binding = "DB"
database_name = "agentora"
database_id = "29737860-a42c-4281-9496-95261ebcdf63"

# Optional: your public address, e.g. https://agentora.ai
# [vars]
# BASE_URL = "https://agentora.ai"
